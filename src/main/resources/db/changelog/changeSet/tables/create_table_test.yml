databaseChangeLog:
  - changeSet:
      id: create_table_test
      author: Vladislav Skaldytskiy
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: test
      changes:
        - createTable:
            tableName: test
            remarks: Тестовая таблица
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
